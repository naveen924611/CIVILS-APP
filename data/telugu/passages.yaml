# TELUGU PRACTICE: COMPREHENSION PASSAGES (8 short passages, 3-4 questions each)
#
# IMPORTANT: the official 2026 APPSC Group-I Telugu qualifying paper syllabus was NOT available when this file was
# written. These passages are GENERAL practice reading, written for this app. They are not copied from any book, past
# paper or official source, and they are marked `source: general`. The Telugu has not been checked by a teacher.
#
# Layout of one item (add your own later, in this file or in a new *.yaml file in this folder):
#   key       unique and never changing (for example p009 or my-p001)
#   level     1 easy, 2 medium, 3 harder
#   source    general | syllabus | pyq   (use "syllabus" only for items checked against the official document)
#   title     Telugu title;  title_en English title
