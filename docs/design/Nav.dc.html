<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 96px; height: 800px; box-sizing: border-box; background: #EFEADF; border-right: 1px solid #DDD5C4; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 6px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #5E5A52;">
<div style="font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; color: #0F5E5A; margin-bottom: 16px;">CC</div>
<sc-for list="{{items}}" as="item" hint-placeholder-count="8">
<a href="{{item.href}}" style="{{item.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span style="font-size: 12px;">{{item.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":null,"default":"today"},"$preview":{"width":96,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'today';
const base = 'display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;min-height:56px;justify-content:center;border-radius:12px;text-decoration:none;';
const defs = [
['today','Today','Main.dc.html','M4 5h16v15H4zM4 10h16M9 3v4M15 3v4'],
['briefs','Briefs','Brief.dc.html','M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5'],
['library','Library','Library.dc.html','M4 4h4v16H4zM10 4h4v16h-4zM16 5l4 1-3 14-4-1'],
['read','Read','Reader.dc.html','M4 19a2 2 0 0 1 2-2h13V3H6a2 2 0 0 0-2 2zM4 19v2h15'],
['notes','Notes','Notes.dc.html','M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1'],
['revise','Revise','RevisionPlan.dc.html','M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7'],
['ask','Ask','Ask.dc.html','M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3'],
['focus','Focus','Focus.dc.html','M4 14a8 8 0 1 0 16 0a8 8 0 1 0-16 0M12 10v4l2 2M9 2h6'],
['alerts','Alerts','Notifications.dc.html','M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4'],
['settings','Settings','Settings.dc.html','M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4']
];
const items = defs.map(([id,label,href,d]) => ({ label, href, d, style: base + (id === a ? 'background:#DCEBE8;color:#0F5E5A;font-weight:600;' : 'color:#5E5A52;') }));
return { items };
}
}
</script>
</body>
</html>
