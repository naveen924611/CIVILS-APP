name: android-apk

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      VERSION_CODE: ${{ github.run_number }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Firebase config (only if the secret exists)
        if: ${{ env.GS_B64 != '' }}
        run: echo "$GS_B64" | base64 -d > app/google-services.json

      - name: Signing key (only if the secret exists)
        if: ${{ env.KS_B64 != '' }}
        env:
          IN_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IN_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Secrets come in through env vars (never pasted into the script) so symbols like $ " ` are safe.
          # Leading/trailing spaces and line breaks from copy-paste are removed.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASS="$(trim "$IN_STORE_PASS")"
          KEY_ALIAS_V="$(trim "$IN_KEY_ALIAS")"
          KEY_PASS_V="$(trim "$IN_KEY_PASS")"
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

          # Fail fast with a clear message (nothing secret is printed).
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS_V" >/dev/null 2>&1; then
            echo "::error::Cannot open the keystore. Check the secrets ANDROID_KEYSTORE_PASSWORD (must be the keystore password), ANDROID_KEY_ALIAS (must match the alias, e.g. civils) and ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS_V"
            echo "KEY_PASSWORD=$KEY_PASS_V"
          } >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: civils-companion-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Attach the APK to a release (easy download on the tablet)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" civils-companion.apk
          gh release create "apk-${{ github.run_number }}" civils-companion.apk \
            --title "Build ${{ github.run_number }}" --notes "Signed APK from commit ${{ github.sha }}" \
            --repo "${{ github.repository }}"
