# Production stack for the Oracle VM. Run from the project folder:  docker compose up -d --build
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////app/data/civils.db
      FCM_SERVICE_ACCOUNT_FILE: /secrets/firebase-service-account.json
    volumes:
      - ./backend-data:/app/data
      - ./secrets:/secrets:ro
    expose:
      - "8000"          # not published to the internet; only Caddy can reach it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
