# TELUGU PRACTICE: VOCABULARY (about 160 words)
#
# IMPORTANT (read this): the official 2026 APPSC Group-I Telugu qualifying paper syllabus was NOT available when
# this file was written. These words are a GENERAL list of everyday, administration and civil-service Telugu that is
# useful for any Telugu qualifying paper. Every item is marked `source: general`. Nothing here is copied from an
# official syllabus or a past paper. When the official syllabus is published, add new items (see below) and, if you
# like, delete the ones that do not fit.
#
# The Telugu was written by an AI assistant and has not been checked by a Telugu teacher. If you find a mistake, fix
# it here (keep the `key` the same) and restart the server: the item is updated on the tablet at the next sync.
#
# HOW TO ADD ITEMS LATER
#   * Add a line to `items:` here, or create another file in this folder (any name ending in .yaml, for example
#     zz_my_words.yaml) with the same layout. Every *.yaml file in data/telugu/ is loaded when the server starts.
#   * `key` must be unique and never change (it is the stable id). Use a new prefix for your own items, e.g. `my-001`.
#   * `level` 1 = everyday, 2 = office and government words, 3 = formal or abstract words.
#   * `source`: general (default) | syllabus (from the official syllabus) | pyq (past paper). Only use "syllabus"
#     for items you have checked against the official document.
#   * Fields: te (Telugu), roman (how to read it, simple letters), en (English meaning), ex_te (example sentence),
#     ex_en (English of the example).
version: 1
items:
  - {kind: vocab, key: v001, level: 1, source: general, te: "ప్రభుత్వం", roman: "prabhutvam", en: "government", ex_te: "ప్రభుత్వం కొత్త పథకాన్ని ప్రారంభించింది.", ex_en: "The government has started a new scheme."}
  - {kind: vocab, key: v002, level: 2, source: general, te: "పాలన", roman: "paalana", en: "administration, governance", ex_te: "మంచి పాలన ప్రజలకు మేలు చేస్తుంది.", ex_en: "Good governance benefits the people."}
  - {kind: vocab, key: v003, level: 1, source: general, te: "జిల్లా", roman: "jillaa", en: "district", ex_te: "మా జిల్లాలో వర్షాలు బాగా కురిశాయి.", ex_en: "It rained well in our district."}
  - {kind: vocab, key: v004, level: 2, source: general, te: "మండలం", roman: "mandalam", en: "mandal (a block of villages in a district)", ex_te: "మండల కార్యాలయంలో సమావేశం జరిగింది.", ex_en: "A meeting was held at the mandal office."}
  - {kind: vocab, key: v005, level: 1, source: general, te: "గ్రామం", roman: "graamam", en: "village", ex_te: "గ్రామంలో కొత్త పాఠశాల నిర్మించారు.", ex_en: "A new school was built in the village."}
  - {kind: vocab, key: v006, level: 1, source: general, te: "పట్టణం", roman: "pattanam", en: "town", ex_te: "ఈ పట్టణంలో జనాభా పెరుగుతోంది.", ex_en: "The population of this town is growing."}
  - {kind: vocab, key: v007, level: 1, source: general, te: "నగరం", roman: "nagaram", en: "city", ex_te: "హైదరాబాద్ ఒక పెద్ద నగరం.", ex_en: "Hyderabad is a big city."}
  - {kind: vocab, key: v008, level: 1, source: general, te: "కార్యాలయం", roman: "kaaryaalayam", en: "office", ex_te: "కార్యాలయం ఉదయం పది గంటలకు తెరుస్తారు.", ex_en: "The office opens at ten in the morning."}
  - {kind: vocab, key: v009, level: 1, source: general, te: "అధికారి", roman: "adhikaari", en: "officer, official", ex_te: "అధికారి ఫైలును పరిశీలించారు.", ex_en: "The officer examined the file."}
  - {kind: vocab, key: v010, level: 1, source: general, te: "ఉద్యోగి", roman: "udyogi", en: "employee", ex_te: "ప్రభుత్వ ఉద్యోగి సమయానికి విధులకు హాజరయ్యాడు.", ex_en: "The government employee reported for duty on time."}
  - {kind: vocab, key: v011, level: 1, source: general, te: "ఉద్యోగం", roman: "udyogam", en: "job, employment", ex_te: "అతనికి మంచి ఉద్యోగం దొరికింది.", ex_en: "He got a good job."}
  - {kind: vocab, key: v012, level: 2, source: general, te: "ఉత్తర్వు", roman: "uttarvu", en: "order (an official order)", ex_te: "కలెక్టర్ ఉత్తర్వులు జారీ చేశారు.", ex_en: "The Collector issued orders."}
  - {kind: vocab, key: v013, level: 2, source: general, te: "దరఖాస్తు", roman: "darakhaastu", en: "application", ex_te: "నేను ఉద్యోగానికి దరఖాస్తు పంపాను.", ex_en: "I sent an application for the job."}
  - {kind: vocab, key: v014, level: 1, source: general, te: "సంతకం", roman: "santakam", en: "signature", ex_te: "దరఖాస్తు కింద మీ సంతకం చేయండి.", ex_en: "Sign below the application."}
  - {kind: vocab, key: v015, level: 1, source: general, te: "తేదీ", roman: "teedi", en: "date", ex_te: "దరఖాస్తుపై తేదీ రాయండి.", ex_en: "Write the date on the application."}
  - {kind: vocab, key: v016, level: 1, source: general, te: "చిరునామా", roman: "chirunaama", en: "address", ex_te: "మీ చిరునామా స్పష్టంగా రాయండి.", ex_en: "Write your address clearly."}
  - {kind: vocab, key: v017, level: 2, source: general, te: "పత్రం", roman: "patram", en: "document, paper", ex_te: "అవసరమైన పత్రాలను జతచేయండి.", ex_en: "Attach the necessary documents."}
  - {kind: vocab, key: v018, level: 2, source: general, te: "ధ్రువీకరణ పత్రం", roman: "dhruveekarana patram", en: "certificate", ex_te: "ధ్రువీకరణ పత్రం తహసీల్దార్ కార్యాలయంలో ఇస్తారు.", ex_en: "The certificate is issued at the tahsildar's office."}
  - {kind: vocab, key: v019, level: 2, source: general, te: "నివేదిక", roman: "nivedika", en: "report", ex_te: "అధికారులు తమ నివేదికను సమర్పించారు.", ex_en: "The officials submitted their report."}
  - {kind: vocab, key: v020, level: 1, source: general, te: "సమావేశం", roman: "samaavesham", en: "meeting", ex_te: "రేపు ఉదయం సమావేశం ఉంది.", ex_en: "There is a meeting tomorrow morning."}
  - {kind: vocab, key: v021, level: 3, source: general, te: "తీర్మానం", roman: "teermaanam", en: "resolution", ex_te: "సభ ఈ తీర్మానాన్ని ఆమోదించింది.", ex_en: "The house passed this resolution."}
  - {kind: vocab, key: v022, level: 2, source: general, te: "నిర్ణయం", roman: "nirnayam", en: "decision", ex_te: "ప్రభుత్వం ముఖ్యమైన నిర్ణయం తీసుకుంది.", ex_en: "The government took an important decision."}
  - {kind: vocab, key: v023, level: 2, source: general, te: "అనుమతి", roman: "anumati", en: "permission", ex_te: "కార్యక్రమానికి అనుమతి లభించింది.", ex_en: "Permission was granted for the event."}
  - {kind: vocab, key: v024, level: 2, source: general, te: "అభ్యర్థన", roman: "abhyarthana", en: "request", ex_te: "మా అభ్యర్థనను దయచేసి పరిశీలించండి.", ex_en: "Please consider our request."}
  - {kind: vocab, key: v025, level: 2, source: general, te: "ఫిర్యాదు", roman: "phiryaadu", en: "complaint", ex_te: "ప్రజలు నీటి సమస్యపై ఫిర్యాదు చేశారు.", ex_en: "The people complained about the water problem."}
  - {kind: vocab, key: v026, level: 2, source: general, te: "పరిష్కారం", roman: "parishkaaram", en: "solution, settlement", ex_te: "సమస్యకు త్వరగా పరిష్కారం కనుగొనాలి.", ex_en: "A solution to the problem must be found quickly."}
  - {kind: vocab, key: v027, level: 2, source: general, te: "విచారణ", roman: "vichaarana", en: "inquiry, hearing", ex_te: "ఈ ఘటనపై విచారణ జరుగుతోంది.", ex_en: "An inquiry is under way on this incident."}
  - {kind: vocab, key: v028, level: 1, source: general, te: "చట్టం", roman: "chattam", en: "law", ex_te: "చట్టం ముందు అందరూ సమానులే.", ex_en: "Everyone is equal before the law."}
  - {kind: vocab, key: v029, level: 2, source: general, te: "రాజ్యాంగం", roman: "raajyaangam", en: "constitution", ex_te: "భారత రాజ్యాంగం 1950 జనవరి 26న అమల్లోకి వచ్చింది.", ex_en: "The Indian Constitution came into force on 26 January 1950."}
  - {kind: vocab, key: v030, level: 1, source: general, te: "హక్కు", roman: "hakku", en: "right", ex_te: "ప్రతి పౌరుడికి ఓటు హక్కు ఉంది.", ex_en: "Every citizen has the right to vote."}
  - {kind: vocab, key: v031, level: 2, source: general, te: "బాధ్యత", roman: "baadhyata", en: "responsibility", ex_te: "తన పనిని సక్రమంగా చేయడం ప్రతి ఉద్యోగి బాధ్యత.", ex_en: "Doing one's work properly is every employee's responsibility."}
  - {kind: vocab, key: v032, level: 2, source: general, te: "కర్తవ్యం", roman: "kartavyam", en: "duty", ex_te: "దేశాన్ని ప్రేమించడం మన కర్తవ్యం.", ex_en: "Loving the country is our duty."}
  - {kind: vocab, key: v033, level: 2, source: general, te: "స్వేచ్ఛ", roman: "sweccha", en: "freedom", ex_te: "భావ ప్రకటనా స్వేచ్ఛ ప్రజాస్వామ్యానికి పునాది.", ex_en: "Freedom of expression is the foundation of democracy."}
  - {kind: vocab, key: v034, level: 3, source: general, te: "సమానత్వం", roman: "samaanatvam", en: "equality", ex_te: "సమాజంలో సమానత్వం ఉండాలి.", ex_en: "There should be equality in society."}
  - {kind: vocab, key: v035, level: 2, source: general, te: "న్యాయం", roman: "nyaayam", en: "justice", ex_te: "ప్రతి ఒక్కరికీ న్యాయం అందాలి.", ex_en: "Justice should reach everyone."}
  - {kind: vocab, key: v036, level: 2, source: general, te: "న్యాయస్థానం", roman: "nyaayasthaanam", en: "court", ex_te: "న్యాయస్థానం కేసును విచారించింది.", ex_en: "The court heard the case."}
  - {kind: vocab, key: v037, level: 2, source: general, te: "తీర్పు", roman: "teerpu", en: "judgment, verdict", ex_te: "న్యాయమూర్తి తీర్పు ప్రకటించారు.", ex_en: "The judge announced the judgment."}
  - {kind: vocab, key: v038, level: 1, source: general, te: "ఎన్నికలు", roman: "ennikalu", en: "elections", ex_te: "వచ్చే నెలలో ఎన్నికలు జరుగుతాయి.", ex_en: "Elections will be held next month."}
  - {kind: vocab, key: v039, level: 1, source: general, te: "ఓటు", roman: "otu", en: "vote", ex_te: "ప్రతి ఓటు విలువైనది.", ex_en: "Every vote is valuable."}
  - {kind: vocab, key: v040, level: 2, source: general, te: "అభ్యర్థి", roman: "abhyarthi", en: "candidate", ex_te: "అభ్యర్థి నామినేషన్ దాఖలు చేశారు.", ex_en: "The candidate filed the nomination."}
  - {kind: vocab, key: v041, level: 1, source: general, te: "ప్రజలు", roman: "prajalu", en: "people, public", ex_te: "ప్రజల సమస్యలను ప్రభుత్వం వినాలి.", ex_en: "The government must listen to the people's problems."}
  - {kind: vocab, key: v042, level: 2, source: general, te: "ప్రజాస్వామ్యం", roman: "prajaaswaamyam", en: "democracy", ex_te: "భారతదేశం అతిపెద్ద ప్రజాస్వామ్య దేశం.", ex_en: "India is the largest democratic country."}
  - {kind: vocab, key: v043, level: 2, source: general, te: "పార్లమెంటు", roman: "paarlamentu", en: "Parliament", ex_te: "పార్లమెంటు సమావేశాలు ఢిల్లీలో జరుగుతాయి.", ex_en: "Parliament sessions are held in Delhi."}
  - {kind: vocab, key: v044, level: 2, source: general, te: "శాసనసభ", roman: "saasanasabha", en: "legislative assembly", ex_te: "శాసనసభలో బడ్జెట్ ప్రవేశపెట్టారు.", ex_en: "The budget was presented in the legislative assembly."}
  - {kind: vocab, key: v045, level: 1, source: general, te: "ముఖ్యమంత్రి", roman: "mukhyamantri", en: "Chief Minister", ex_te: "ముఖ్యమంత్రి జిల్లాలో పర్యటించారు.", ex_en: "The Chief Minister toured the district."}
  - {kind: vocab, key: v046, level: 2, source: general, te: "గవర్నర్", roman: "gavarnar", en: "Governor", ex_te: "గవర్నర్ కొత్త మంత్రులతో ప్రమాణం చేయించారు.", ex_en: "The Governor administered the oath to the new ministers."}
  - {kind: vocab, key: v047, level: 1, source: general, te: "మంత్రి", roman: "mantri", en: "minister", ex_te: "విద్యాశాఖ మంత్రి పాఠశాలను సందర్శించారు.", ex_en: "The Education Minister visited the school."}
  - {kind: vocab, key: v048, level: 1, source: general, te: "ప్రధానమంత్రి", roman: "pradhaanamantri", en: "Prime Minister", ex_te: "ప్రధానమంత్రి జాతినుద్దేశించి ప్రసంగించారు.", ex_en: "The Prime Minister addressed the nation."}
  - {kind: vocab, key: v049, level: 2, source: general, te: "రాష్ట్రపతి", roman: "raashtrapati", en: "President", ex_te: "రాష్ట్రపతి భారతదేశానికి రాజ్యాంగ అధిపతి.", ex_en: "The President is the constitutional head of India."}
  - {kind: vocab, key: v050, level: 1, source: general, te: "రాష్ట్రం", roman: "raashtram", en: "state", ex_te: "రాష్ట్ర ప్రభుత్వం రైతులకు సహాయం ప్రకటించింది.", ex_en: "The state government announced help for farmers."}
  - {kind: vocab, key: v051, level: 1, source: general, te: "దేశం", roman: "desam", en: "country", ex_te: "భారతదేశం వైవిధ్యానికి పేరుగాంచింది.", ex_en: "India is famous for its diversity."}
  - {kind: vocab, key: v052, level: 2, source: general, te: "కేంద్ర ప్రభుత్వం", roman: "kendra prabhutvam", en: "central government", ex_te: "కేంద్ర ప్రభుత్వం కొత్త నిధులు విడుదల చేసింది.", ex_en: "The central government released new funds."}
  - {kind: vocab, key: v053, level: 1, source: general, te: "పన్ను", roman: "pannu", en: "tax", ex_te: "ప్రజలు సకాలంలో పన్ను చెల్లించాలి.", ex_en: "People should pay tax on time."}
  - {kind: vocab, key: v054, level: 2, source: general, te: "బడ్జెట్", roman: "badjet", en: "budget", ex_te: "ఈ ఏడాది బడ్జెట్‌లో విద్యకు ఎక్కువ నిధులు కేటాయించారు.", ex_en: "More funds were allotted to education in this year's budget."}
  - {kind: vocab, key: v055, level: 2, source: general, te: "ఆదాయం", roman: "aadaayam", en: "income, revenue", ex_te: "ప్రభుత్వ ఆదాయం పెరిగింది.", ex_en: "The government's revenue increased."}
  - {kind: vocab, key: v056, level: 1, source: general, te: "ఖర్చు", roman: "kharchu", en: "expense, expenditure", ex_te: "అనవసర ఖర్చులను తగ్గించాలి.", ex_en: "Unnecessary expenses should be reduced."}
  - {kind: vocab, key: v057, level: 1, source: general, te: "అప్పు", roman: "appu", en: "loan, debt", ex_te: "రైతులు బ్యాంకు నుంచి అప్పు తీసుకున్నారు.", ex_en: "The farmers took a loan from the bank."}
  - {kind: vocab, key: v058, level: 2, source: general, te: "పెట్టుబడి", roman: "pettubadi", en: "investment", ex_te: "కొత్త పరిశ్రమల్లో పెట్టుబడి పెరిగింది.", ex_en: "Investment in new industries increased."}
